const tip2=P.reduce((m,v)=>v.dot(ax)>m.dot(ax)?v:m,P[0]); const tmax=tip2.dot(ax);

const HP=[]; for(const t of handTris) for(const v of t) HP.push(v);

const ALL=[]; for(const tr of tris) for(const v of tr) ALL.push(v);
const prof=[]; for(let d=0.02; d<1.3; d+=0.02){ const st=ALL.filter(v=>Math.abs(alongF(v)-d)<0.01); if(st.length<10) continue; const cpt=st.reduce((s,v)=>s.add(v),new THREE.Vector3()).multiplyScalar(1/st.length); const r=Math.max(...st.map(v=>{const q=v.clone().sub(cpt); return Math.hypot(q.dot(e2),q.dot(e3));})); prof.push([d,r,cpt]); }

L('frame f',f.toArray().map(v=>v.toFixed(2)),'t',t.toArray().map(v=>v.toFixed(2)),'n',n.toArray().map(v=>v.toFixed(2)));
const wristPt=wristC.clone(); const handLenBase=wristD; const scale=HAND_LEN/handLenBase;
const cuff=window.__cuff; L('scale',scale.toFixed(4),'scaled wrist radius',(wristR*scale).toFixed(3),'cuff outer radius ~',cuff.rMax.toFixed(3));
const seat=new THREE.Vector3(cuff.x-0.008, 0.871, -0.013); // wrist plane just inside the cuff mouth L('base hand length',handLenBase.toFixed(3),'scale',scale.toFixed(4));
// target frame for HIS left hand: fingers +x, thumb +z, palm-out -y ; origin at his left hand bone
const R=new THREE.Matrix4().makeBasis(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,-1,0)); // columns = images of f,t,n
const B=new THREE.Matrix4().makeBasis(f,t,n); const Binv=B.clone().invert();

L('left hand bbox', new THREE.Box3().setFromPoints(leftHand.flat()).min.toArray().map(v=>v.toFixed(3)), new THREE.Box3().setFromPoints(leftHand.flat()).max.toArray().map(v=>v.toFixed(3)));

// ---- 2. his body minus glove pieces
const pos0=G.attributes.position, uv0=G.attributes.uv, si0=G.attributes.skinIndex, sw0=G.attributes.skinWeight;
const idx0=G.index?Array.from(G.index.array):[...Array(pos0.count).keys()];
const domHand=v=>{let best=0,bi=0;for(let k=0;k<4;k++){const w=sw0.getComponent(v,k); if(w>best){best=w;bi=si0.getComponent(v,k)}} return /Hand/.test(sk.bones[bi].name)};

const [u0,v0,u1,v1]=[TILE[0]/2048, 1-TILE[3]/2048, TILE[2]/2048, 1-TILE[1]/2048];
const addHand=(hand, sign)=>{ const bb=new THREE.Box3().setFromPoints(hand.flat()); const sx=bb.max.x-bb.min.x, sz=bb.max.z-bb.min.z;
  for(const tr of hand) for(const v of tr){ P_.push(v.x,v.y,v.z); U_.push(u0+(u1-u0)*((v.x-bb.min.x)/sx*0.94+0.03), v0+(v1-v0)*((v.z-bb.min.z)/sz*0.94+0.03)); const g=nearest(v); for(let k=0;k<4;k++){SI_.push(g.si[k]); SW_.push(g.sw[k]);} } };

geo.setAttribute('position',new THREE.Float32BufferAttribute(P_,3)); geo.setAttribute('uv',new THREE.Float32BufferAttribute(U_,2));

// sample forearm skin colour from the known skin island (rolled sleeve forearm), ~ x 780-930, y 420-700

const tw=TILE[2]-TILE[0], th=TILE[3]-TILE[1]; const tile=cx.createImageData(tw,th); const rnd=()=>Math.random();
for(let y=0;y<th;y++)for(let x=0;x<tw;x++){ const i=(y*tw+x)*4; const nse=(rnd()-0.5)*14; const vig=1-0.10*Math.pow(Math.hypot((x/tw-0.5)*2,(y/th-0.5)*2),2); const knuck=0.96+0.04*Math.sin(x/tw*Math.PI*9)*Math.sin(y/th*Math.PI*3); const m=vig*knuck; tile.data[i]=Math.min(255,r*m+nse); tile.data[i+1]=Math.min(255,g*m+nse*0.8); tile.data[i+2]=Math.min(255,b*m+nse*0.7); tile.data[i+3]=255; }

const mesh=new THREE.SkinnedMesh(geo,mat); mesh.name='Vintos'; mesh.frustumCulled=false;

const anims=fb.animations||[];
const exp=new GLTFExporter(); const buf=await new Promise((r,j)=>exp.parse(root,r,j,{binary:true,animations:anims,onlyVisible:false}));
const u8=new Uint8Array(buf); let bin=''; for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); window.__glb=btoa(bin);
window.__atlas=atlasURL.split(',')[1]; window.__log=log; window.__done=true;
} catch(e){ log.push('ERR '+(e&&e.stack||e)); window.__log=log; window.__done=true; }
</script>
